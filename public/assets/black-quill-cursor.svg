<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Feather quill pen in black ink style -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main Feather Plume -->
    <path d="M4 31 L8 25 C9 22 13 17 19 11 C25 5 29 2 33 2 C34 4 33 8 30 13 C26 18 20 23 15 26 L8 28 Z" fill="#111827"/>
    <!-- Feather Barbs / Vanes -->
    <path d="M21 9 C25 6 29 3 33 2 C32 6 29 10 26 13" stroke="#374151" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M17 13 C20 10 24 8 28 7" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
    <path d="M14 17 C17 14 21 12 25 11" stroke="#4b5563" stroke-width="1" stroke-linecap="round"/>
    <path d="M11 21 C14 18 17 16 20 15" stroke="#374151" stroke-width="1" stroke-linecap="round"/>
    <!-- Shaft / Rachis -->
    <path d="M4 31 Q 14 20 33 2" stroke="#f3f4f6" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Metallic Nib / Calamus -->
    <path d="M2 33 L4 28 L7 31 Z" fill="#1f2937" stroke="#111827" stroke-width="0.8"/>
    <!-- Nib Split & Point -->
    <path d="M2 33 L4.5 30" stroke="#f9fafb" stroke-width="0.7"/>
    <!-- Tiny ink dot at tip -->
    <circle cx="2" cy="33" r="1" fill="#000000"/>
  </g>
</svg>
